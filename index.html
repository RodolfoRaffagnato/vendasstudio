<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cota por Loja</title>
<meta name="theme-color" content="#3f687e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: barra do modelo (trocar entre link da loja e app da gerência); loja = só o formulário; gerência = mês + navegação Rede/Lojas/Cotas */
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#111a2e; --muted:#56607a; --line:#d8dde8;
  --accent:#1f4fd1; --accent-soft:#e2e9fb; --on-accent:#ffffff;
  --ok:#12805c; --ok-soft:#dcf3ea; --warn:#9a5500; --warn-soft:#fdecd2; --bad:#c0322b; --bad-soft:#fbe3e1; --on-bad:#ffffff;
  --track:#e3e7ef; --demo:#fff4cf; --demo-ink:#5c4500; --past:#5b3fb8; --past-soft:#ece6fb; --scrim:rgba(10,15,30,.55);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c111c; --surface:#161e2e; --ink:#f2f5fb; --muted:#a9b3c9; --line:#2c3750;
    --accent:#86a6ff; --accent-soft:#1c2a4d; --on-accent:#0b1430;
    --ok:#5fd3a5; --ok-soft:#123327; --warn:#ffc069; --warn-soft:#3a2a10; --bad:#ff8c84; --bad-soft:#3d1916; --on-bad:#2a0606;
    --track:#253049; --demo:#3a300d; --demo-ink:#ffe08a; --past:#c3b0ff; --past-soft:#2a2150; --scrim:rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c111c; --surface:#161e2e; --ink:#f2f5fb; --muted:#a9b3c9; --line:#2c3750;
  --accent:#86a6ff; --accent-soft:#1c2a4d; --on-accent:#0b1430;
  --ok:#5fd3a5; --ok-soft:#123327; --warn:#ffc069; --warn-soft:#3a2a10; --bad:#ff8c84; --bad-soft:#3d1916; --on-bad:#2a0606;
  --track:#253049; --demo:#3a300d; --demo-ink:#ffe08a; --past:#c3b0ff; --past-soft:#2a2150; --scrim:rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
#view{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}

/* barra do modelo */
.modelo{margin-top:14px;border:2px dashed var(--demo-ink);background:var(--demo);color:var(--demo-ink);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.modelo p{margin:0;font-size:.9rem;font-weight:600}
.modelo .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.modelo .lb{font-weight:800;text-transform:uppercase;font-size:.78rem;letter-spacing:.06em}
.seg{display:inline-flex;background:var(--surface);border-radius:12px;padding:3px;gap:3px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sel{min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px;font-weight:700}

.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.9rem;letter-spacing:.01em;margin:0;text-transform:uppercase}

/* blocos */
.card{background:var(--surface);border-radius:var(--r);padding:18px;border:1px solid var(--line)}
.sec-t{font-family:var(--f-display);font-weight:700;font-size:1.25rem;text-transform:uppercase;letter-spacing:.04em;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-t small{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-weight:600;color:var(--muted);font-size:.9rem}
.lbl{display:block;font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}

/* formulário */
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:12px;align-items:end}
.inp{width:100%;min-height:54px;border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:8px 12px;font-weight:600}
.money{display:flex;align-items:center;gap:8px;min-height:54px;border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:0 14px}
.money:focus-within{border-color:var(--accent)}
.money.err{border-color:var(--bad)}
.money span{font-weight:700;color:var(--muted)}
.money input{flex:1;min-width:0;border:0;background:transparent;outline:0;text-align:right;font-family:var(--f-display);font-weight:700;font-size:1.7rem;font-variant-numeric:tabular-nums}
.btn{min-height:54px;border:0;border-radius:12px;padding:0 22px;font-weight:700;background:var(--accent);color:var(--on-accent)}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent-soft)}
.btn.dng{background:var(--bad);color:var(--on-bad)}
.btn.sm{min-height:44px;padding:0 16px;font-size:.95rem}
.aviso{margin:10px 0 0;font-size:.92rem;color:var(--warn);font-weight:600}
.ok-msg{margin:10px 0 0;font-size:1rem;color:var(--ok);font-weight:700;background:var(--ok-soft);padding:10px 12px;border-radius:10px}

/* tela da loja (link) */
.loja-app{width:100%;display:flex;flex-direction:column;gap:14px}
.loja-app .card{padding:22px}

.loja-app .money input{font-size:2.2rem}
.loja-app .btn{min-height:60px;font-size:1.1rem}
.badge-link{display:inline-flex;gap:6px;align-items:center;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.85rem;width:max-content}
.loja-app h2{font-family:var(--f-display);font-size:2rem;text-transform:uppercase;margin:8px 0 4px}

/* gerência: cabeçalho */
.ger-head{display:flex;flex-direction:column;gap:12px}
.mesnav{display:flex;align-items:center;gap:8px}
.mesnav button{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:1.4rem;font-weight:700}
.mesnav button:disabled{opacity:.3;cursor:default}
.mesnav b{font-family:var(--f-display);font-size:1.6rem;text-transform:uppercase;min-width:0;flex:1;text-align:center}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.passado{background:var(--past-soft);border:3px solid var(--past);border-radius:var(--r);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.passado b{color:var(--past);font-size:1.05rem;display:block}
.passado .btn{background:var(--past);color:var(--surface)}

/* quadro */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .v{font-family:var(--f-display);font-weight:800;font-size:2.3rem;line-height:1.05;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .s{font-size:.9rem;color:var(--muted);font-weight:500}
.tile.falta{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tile.falta .lbl,.tile.falta .s{color:inherit;opacity:.75}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:700;width:max-content;max-width:100%}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.neu{background:var(--track);color:var(--muted)}
.mes-l{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.mes-l .big{font-family:var(--f-display);font-weight:800;font-size:2rem;font-variant-numeric:tabular-nums}
.mes-l .of{color:var(--muted);font-weight:600}
.regua{position:relative;height:22px;background:var(--track);border-radius:11px;margin:16px 0 30px}
.regua.semmarca{margin-bottom:14px}
.regua .fill{position:absolute;inset:0 auto 0 0;border-radius:11px;background:var(--accent);max-width:100%}
.regua .fill.ok{background:var(--ok)} .regua .fill.warn{background:var(--warn)} .regua .fill.bad{background:var(--bad)}
.regua .mark{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--ink);border-radius:2px}
.regua .mark b{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);font-size:.78rem;font-weight:700;white-space:nowrap;color:var(--ink)}
.regua .mark.end b{left:auto;right:0;transform:none}
.regua .mark.start b{left:0;transform:none}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;border-top:1px solid var(--line);padding-top:14px}
.facts div{display:flex;flex-direction:column;gap:2px;min-width:0}
.facts b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.facts span{font-size:.85rem;color:var(--muted);font-weight:600}
.proj{border:2px solid var(--accent)}
.nota{margin:12px 0 0;font-size:.85rem;color:var(--muted)}

/* tabelas */
.tbl-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
td.loja{font-weight:700}
tfoot td{font-weight:800;border-bottom:0;border-top:2px solid var(--ink)}
.pos{color:var(--ok);font-weight:700} .neg{color:var(--bad);font-weight:700}
.vazio{color:var(--muted);text-align:center;padding:18px}

/* senha */
.lock{max-width:420px;width:100%;margin:20px auto;display:flex;flex-direction:column;gap:12px}
.lock h2{font-family:var(--f-display);font-size:1.8rem;text-transform:uppercase;margin:0}
.lock p{margin:0;color:var(--muted)}
.erro{color:var(--bad);font-weight:700;margin:0}
.cotas-edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 14px}
.cotas-edit .inp,.cotas-edit .money{min-height:48px}
.cotas-edit .money input{font-size:1.3rem}
.acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

/* confirmação */
.ovl{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--surface);border-radius:18px;max-width:460px;width:100%;padding:22px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.dlg h3{font-family:var(--f-display);font-size:1.6rem;text-transform:uppercase;margin:0}
.dlg p{margin:0}
.troca{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;background:var(--bg);border-radius:12px;padding:12px}
.troca div{display:flex;flex-direction:column;min-width:0}
.troca small{font-weight:700;color:var(--muted);text-transform:uppercase;font-size:.75rem;letter-spacing:.05em}
.troca b{font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.troca .seta{font-size:1.4rem;color:var(--muted)}
.alerta{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:12px;font-weight:700}
.alerta.warn{background:var(--warn-soft);color:var(--warn)}
.dlg .btn{width:100%}

.foot{color:var(--muted);font-size:.85rem;text-align:center}

@media (max-width:720px){
  .form{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .form .btn{grid-column:1/-1}
  .form .f-valor{grid-column:1/-1;order:-1}
  .form > div:first-child{grid-column:1/-1}
  .tiles{grid-template-columns:minmax(0,1fr)}
  .tile .v{font-size:2rem;overflow-wrap:normal}
  .troca{grid-template-columns:minmax(0,1fr)}
  .troca .seta{transform:rotate(90deg);width:max-content}
  .troca b{overflow-wrap:normal}
  .facts{grid-template-columns:minmax(0,1fr)}
  .cotas-edit{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){ .regua .fill{transition:width .4s ease} }

.carregando{text-align:center;color:var(--muted);font-weight:600;padding:40px 18px}
.lnk{border:0;background:none;color:var(--accent);font-weight:700;text-decoration:underline;padding:0}
.chk{display:flex;gap:10px;align-items:center;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.links{display:flex;flex-direction:column;gap:14px}
.linkrow{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.linkrow:last-child{border-bottom:0;padding-bottom:0}
.linkrow .inp{min-height:46px;font-size:.85rem;font-weight:500}
.sel-all{user-select:all;overflow-wrap:anywhere}
.btn:disabled{opacity:.6;cursor:default}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);
  padding:12px 18px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.loja-app h2{margin-top:0}
.instalar{background:var(--accent);color:var(--on-accent);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.instalar b{font-family:var(--f-display);font-size:1.5rem;text-transform:uppercase;letter-spacing:.02em}
.instalar p{margin:0;font-weight:500}
.instalar ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px;font-weight:600}
.instalar .btn{background:var(--on-accent);color:var(--accent);font-size:1.15rem;min-height:58px}
.instalar .lnk{color:inherit;opacity:.85;align-self:flex-start}
.linha-acao{display:flex;gap:22px;flex-wrap:wrap;grid-column:1/-1;margin:-2px 0 10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.dng-lnk{color:var(--bad)}
.lr-inativa{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
select.inp{appearance:auto}
.inicio{text-align:center;align-items:stretch}
.logo-ini{width:96px;height:96px;border-radius:22px;align-self:center}
.btn.grande{min-height:72px;font-size:1.25rem}
.lista-lojas{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.inp.pin{font-size:2rem;letter-spacing:.6em;text-align:center;font-weight:800}
.pinrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.pin-atual{color:var(--muted);font-weight:600}
.pin-atual b{color:var(--ink);font-size:1.2rem;letter-spacing:.15em}
.pin-edit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.pin-edit .inp{min-height:46px}
.seg.tipo{display:flex;background:var(--track);border-radius:14px;padding:4px;gap:4px;margin-bottom:8px}
.seg.tipo button{flex:1;border:0;background:transparent;border-radius:10px;min-height:52px;font-weight:700;color:var(--muted);font-size:1rem}
.seg.tipo button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dica-tipo{margin:0 0 12px;font-size:.92rem}
.form.fech{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
.form.fech .nums,.form.fech .btn{grid-column:1/-1}
.nums{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.inp.num{font-family:var(--f-display);font-size:1.5rem;font-weight:700;text-align:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:12px;background:var(--bg);min-width:0}
.kpi b{font-family:var(--f-display);font-size:1.4rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi small{color:var(--muted);font-weight:600;font-size:.82rem}
.loja-acao{display:flex;flex-direction:column;gap:14px;padding:20px}
.dia-hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.dia-hdr .lbl{margin:0}
.dia-t{font-family:var(--f-display);font-size:1.9rem;text-transform:uppercase;line-height:1.1;display:block}
.dia-inp{width:auto;min-height:46px}
.passos{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.passos li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--track);color:var(--muted);font-weight:700;font-size:.95rem;line-height:1.2}
.passos li span{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-weight:800}
.passos li.atual{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.passos li.atual span{background:var(--accent);color:var(--on-accent)}
.passos li.feito{background:var(--ok-soft);color:var(--ok)}
.passos li.feito span{background:var(--ok);color:var(--surface)}
.passos li.bloq{opacity:.55}
.passo{display:flex;flex-direction:column;gap:10px}
.passo .lbl{margin:4px 0 0}
.money.grande{min-height:72px}
.money.grande input{font-size:2.4rem}
.feito-linha{margin:0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:10px 14px;font-weight:600}
.feito-linha b{color:var(--ink)}
.fechado{display:flex;flex-direction:column;gap:12px}
.ok-titulo{margin:0;font-family:var(--f-display);font-size:1.5rem;text-transform:uppercase;color:var(--ok)}
details.lanc summary{cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:1.25rem;text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;list-style:none}
details.lanc summary::-webkit-details-marker{display:none}
details.lanc summary::after{content:'▾';margin-left:auto}
details.lanc[open] summary::after{content:'▴'}
details.lanc summary small{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-weight:600;color:var(--muted);font-size:.85rem}
details.lanc[open] summary{margin-bottom:12px}
.kpi small.pos{color:var(--ok)} .kpi small.neg{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <main id="view"><div class="card carregando">Carregando…</div></main>
</div>
<div id="dlg"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
/* ---------- qual tela abrir ----------
   Link com ?loja=CÓDIGO abre a tela daquela loja e o aparelho passa a lembrar dela
   (assim o ícone instalado na tela do celular abre direto na loja certa).
   Sem código: tela da gerência (com senha). */
const BOOT = (function(){
  let t = '';
  try { t = new URLSearchParams(location.search).get('loja') || ''; } catch(e){}

async function call(fn){

}

/* ---------- cálculos ---------- */
function calc(l, m, ref){
  const DIAS = diasDe(m), cota = cotaDe(l,m);
  const fechado = m < MES_ATUAL;
  if (fechado || !ref) ref = fechado ? m + '-' + pad(DIAS) : HOJE;
  const dia = +ref.slice(8,10);
  const cotaDia = Math.round(cota / DIAS);
  const vendaDia = l.vendas[ref];
  const doMes = Object.keys(l.vendas).filter(d => d.startsWith(m) && d <= ref).map(d => [d, l.vendas[d]]);
  const vendido = doMes.reduce((a,x) => a+x[1], 0);
  const falta = Math.max(0, cota - vendido);
  const pct = cota ? vendido / cota : 0;
  const esperado = dia / DIAS;
  const restantes = DIAS - dia + (vendaDia == null ? 1 : 0);
  const porDia = restantes > 0 ? Math.ceil(falta / restantes) : falta;
  const r = esperado ? pct / esperado : 1;
  const status = !cota ? ['neu','Sem cota'] : pct >= 1 ? ['ok', fechado ? 'Bateu a cota' : 'Cota batida'] : fechado ? ['bad','Não bateu'] : r >= 1 ? ['ok','No ritmo'] : r >= 0.9 ? ['warn','Atenção'] : ['bad','Abaixo do ritmo'];
  const diasBase = vendaDia == null ? dia - 1 : dia;
  const media = diasBase > 0 ? vendido / diasBase : 0;
  const proj = fechado ? vendido : Math.round(media * DIAS);
  const melhor = doMes.reduce((a,x) => !a || x[1] > a[1] ? x : a, null);
  // parcial das 17h, atendimentos e número de vendas
  const P = l.parcial || {}, A = l.atend || {}, Q = l.qtd || {};
  const diasQ = Object.keys(Q).filter(d => d.startsWith(m) && d <= ref);
  const atendMes = Object.keys(A).filter(d => d.startsWith(m) && d <= ref).reduce((a,d) => a + A[d], 0);
  const qtdMes = diasQ.reduce((a,d) => a + Q[d], 0);
  const vendQ = diasQ.reduce((a,d) => a + (l.vendas[d] || 0), 0);
  const extra = { parcialDia: P[ref], atendDia: A[ref], qtdDia: Q[ref], atendMes, qtdMes, vendQ };
  return { ...extra, DIAS, cota, dia, cotaDia, vendaDia, vendido, falta, pct, esperado, restantes, porDia, status, media, proj, projPct: cota ? proj/cota : 0,
    diasLanc: doMes.length, melhor, fechado, diffDia: vendaDia == null ? null : vendaDia - cotaDia };
}

function confirmar(o){

      <button class="btn ghost" id="dlg-nao">${o.nao || 'Cancelar'}</button></div></div>`;
    const fim = v => { el.innerHTML = ''; res(v); };
    el.querySelector('#dlg-sim').onclick = () => fim(true);
    el.querySelector('#dlg-nao').onclick = () => fim(false);
    el.querySelector('.ovl').onclick = e => { if (e.target.classList.contains('ovl')) fim(false); };

}
async function conferirVenda(l, data, novo, tipo, atend, qtd){
  const m = data.slice(0,7), cotaDia = m === S.mes ? Math.round(cotaDe(l,m) / diasDe(m)) : 0;
  const parc = (l.parcial || {})[data], tot = l.vendas[data];
  const antigo = tipo === 'parcial' ? parc : tot;
  const nomeTipo = tipo === 'parcial' ? 'a parcial das 17h' : 'o fechamento';
  const avisos = [];
  if (tipo === 'fechamento') {
    if (parc != null && novo < parc) avisos.push(`A venda total (${brl(novo)}) está menor que a parcial das 17h (${brl(parc)}).`);
    if (qtd > atend) avisos.push(`Há mais vendas (${qtd}) do que atendimentos (${atend}).`);
  } else if (tot != null && novo > tot) avisos.push(`A parcial das 17h (${brl(novo)}) está maior que a venda total já lançada (${brl(tot)}).`);
  if (antigo == null && cotaDia && (novo < cotaDia * (tipo === 'parcial' ? 0.05 : 0.15) || novo > cotaDia * 4))
    avisos.push(`${brl(novo)} está muito ${novo < cotaDia ? 'abaixo' : 'acima'} da cota diária da ${esc(l.nome)} (${brl(cotaDia)}).`);
  const lista = avisos.map(a => `<div class="alerta warn">${a}</div>`).join('');
  if (antigo != null && antigo !== novo) {
    const r = novo / antigo, grande = r < 0.5 || r > 2;
    const varTxt = r < 1 ? `${(Math.round((1-r)*1000)/10).toLocaleString('pt-BR')}% menor` : `${(Math.round((r-1)*1000)/10).toLocaleString('pt-BR')}% maior`;
    return confirmar({
      titulo: `Trocar ${nomeTipo} de ${dataBR(data)}?`,
      corpo: `<p>Já existe ${tipo === 'parcial' ? 'uma parcial das 17h lançada' : 'um fechamento lançado'} para a <b>${esc(l.nome)}</b> neste dia.</p>
        <div class="troca"><div><small>Lançado</small><b>${brl(antigo)}</b></div><span class="seta">→</span><div><small>Novo valor</small><b>${brl(novo)}</b></div></div>
        ${grande ? `<div class="alerta">Atenção: o novo valor é ${varTxt} que o lançado. Confira se não faltou ou sobrou algum zero.</div>` : `<p class="muted">O novo valor é ${varTxt} que o lançado.</p>`}${lista}`,
      sim: `Sim, trocar para ${brl(novo)}`, nao: `Não, manter ${brl(antigo)}`, perigo: grande
    });
  }
  if (avisos.length) return confirmar({ titulo: 'Confira os números', corpo: lista + '<p>Está tudo certo?</p>', sim: 'Sim, está certo', nao: 'Corrigir' });
  return true;
}

function totais(m, ref){

    qtdDia: c.qtdDia != null ? (a.qtdDia || 0) + c.qtdDia : a.qtdDia, vendaDiaQ: a.vendaDiaQ + (c.qtdDia != null ? (c.vendaDia || 0) : 0),
    atendMes:a.atendMes+c.atendMes, qtdMes:a.qtdMes+c.qtdMes, vendQ:a.vendQ+c.vendQ }; },
    {cota:0,cotaDia:0,vendaDia:0,vendido:0,falta:0,proj:0,parcialDia:null,atendDia:null,qtdDia:null,vendaDiaQ:0,atendMes:0,qtdMes:0,vendQ:0});
  T.pct = T.cota ? T.vendido/T.cota : 0;
  return [cs, T];
}

}

const ehAndroid = /android/i.test(navigator.userAgent);

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); promptInstalar = e; render(); });

function bannerInstalar(){
  if (window.PROTOTIPO) return '';

  const quem = S.modo === 'loja' && D && D.lojas[0] ? 'da ' + esc(D.lojas[0].nome) : 'da gerência';
  if (promptInstalar) return `<section class="instalar"><b>Instale o aplicativo</b>

    <button class="lnk" data-a="ja-instalei">Já fiz isso</button></section>`;

    <ol><li>Toque nos três pontinhos ⋮ no canto de cima.</li><li>Toque em <u>Abrir no Chrome</u>.</li><li>No Chrome, toque em <u>Instalar aplicativo</u>.</li></ol></section>`;
  if (ehAndroid) return `<section class="instalar"><b>Instale o aplicativo</b>

async function carregar(silencioso){

async function trocarMes(alvo){

    sim: `Sim, ver ${nomeMesC(alvo)}`, nao: `Ficar em ${nomeMesC(S.mes)}`
  });

  S.mes = alvo; S.gv = 'rede'; S.msg = ''; S.f = { data:'', valor:0 }; S.cotasMes = ''; S.cotasData = null;
  view.innerHTML = `<div class="card carregando">Carregando ${nomeMes(alvo)}…</div>`;

function copiarTexto(txt, msgOk){
  const ok = () => toast(msgOk || 'Copiado.');
  const fallback = () => {
    const t = document.createElement('textarea'); t.value = txt; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select();
    try { document.execCommand('copy') ? ok() : toast('Não consegui copiar. Segure o dedo no texto e copie.'); } catch(e){ toast('Não consegui copiar.'); }
    t.remove();
  };
  try { navigator.clipboard.writeText(txt).then(ok, fallback); } catch(e){ fallback(); }
}

    if (k === 'teste-email') {
      a.disabled = true; a.textContent = 'Enviando…';
      try { const para = await call('apiGerTesteResumo', S.senha); toast('Resumo enviado para ' + para); } catch(er){ toast(msgErro(er)[1]); }
      a.disabled = false; a.textContent = 'Enviar um resumo de teste agora';
    }
    return;
  }
  const dd = e.target.closest('tr[data-dia]');
  if (dd) {
    const l = S.modo === 'loja' ? D.lojas[0] : lojaById(S.gv);
    const d = dd.dataset.dia;
    S.f = { data: d, valor: 0 }; S.msg = ''; if (d !== HOJE) S.trocaDia = true;
    if (S.modo === 'ger' && S.mes === MES_ATUAL) S.ref = dd.dataset.dia;
    render(); window.scrollTo(0,0);
  }
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'form-venda') {
    const l = S.modo === 'loja' ? D.lojas[0] : lojaById(+f.dataset.loja);
    const tipo = f.dataset.tipo, fech = tipo === 'fechamento';
    if (!S.f.valor) { const i = document.getElementById('f-valor'); i.closest('.money').classList.add('err'); i.focus(); return; }
    const atend = fech ? parseInt(S.f.atend, 10) : null, qtd = fech ? parseInt(S.f.qtd, 10) : null;
    if (fech && isNaN(atend)) { toast('Digite o número de atendimentos do dia.'); document.getElementById('f-atend').focus(); return; }
    if (fech && isNaN(qtd)) { toast('Digite o número de vendas do dia.'); document.getElementById('f-qtd').focus(); return; }
    if (!(await conferirVenda(l, S.f.data, S.f.valor, tipo, atend, qtd))) { const i = document.getElementById('f-valor'); if (i) i.focus(); return; }
    const dia = S.f.data, valor = S.f.valor, era = fech ? l.vendas[dia] : (l.parcial || {})[dia];
    const dados = { tipo, valor, atend, qtd };
    S.ocupado = true; render();
    try {
      usar(S.modo === 'loja' ? await call('apiLojaLancar', S.token, dia, dados) : await call('apiGerLancar', S.senha, l.id, dia, dados, S.mes));
      S.f = { data: dia, valor: 0 };
      const nome = fech ? 'Fechamento' : 'Parcial das 17h';
      if (!fech && era == null) { S.msg = `✓ Parcial lançada: ${brl(valor)}. Agora, no fim do dia, faça o fechamento.`; S.ocupado = false; render(); return; }
      S.msg = era != null && era !== valor ? `✓ ${nome} de ${dataBR(dia)} trocado: ${brl(era)} → ${brl(valor)}.`
        : `✓ ${nome} lançado: ${brl(valor)} em ${dataBR(dia)}${fech ? ` · ${atend} atendimentos · ${qtd} vendas` : ''}.`;
    } catch(er) { toast(msgErro(er)[1]); }
    S.ocupado = false; render();
  }
  if (f.id === 'form-pin') {
    const pin = (document.getElementById('pin').value || '').replace(/\D/g,'');
    if (pin.length !== 4) { S.pinErro = ERROS.PIN_FORMATO; render(); return; }
    S.ocupado = true; S.pinErro = ''; render();
    try {
      const r = await call('apiLojaEntrar', S.lojaEsc.id, pin);
      try { localStorage.setItem('cota_loja', r.token); } catch(_){}
      S.token = r.token; S.modo = 'loja'; S.ocupado = false;
      view.innerHTML = '<div class="card carregando">Carregando…</div>';
      await carregar(); return;
    } catch(er) { S.pinErro = msgErro(er)[1]; }
    S.ocupado = false; render();
  }
  if (f.id === 'form-senha') {
    const senha = document.getElementById('senha').value, lembrar = document.getElementById('lembrar').checked;
    if (!senha) return;
    S.ocupado = true; S.erroSenha = ''; render();
    try { S.senha = senha; usar(await call('apiGer', senha, '')); S.gerOk = true; store.set('cota_senha', senha, lembrar); }
    catch(er) { S.senha = ''; S.erroSenha = msgErro(er)[1]; }
    S.ocupado = false; render();
  }
  if (f.id === 'form-cotas') {
    const cm = S.cotasMes || S.mes;
    const itens = ATIVAS().map(l => ({ id: l.id, nome: document.getElementById('n-'+l.id).value.trim(), cota: +document.getElementById('c-'+l.id).dataset.c }));
    S.ocupado = true; render();
    try {
      await call('apiGerSalvar', S.senha, cm, itens);
      usar(await call('apiGer', S.senha, S.mes));
      S.cotasData = await call('apiGerCotas', S.senha, cm);
      S.msg = `✓ Nomes e cotas de ${nomeMesC(cm)} salvos. As lojas já veem os valores novos.`;
    }
    catch(er) { toast(msgErro(er)[1]); }
    S.ocupado = false; render();
  }
  if (f.id === 'form-add-loja') {
    const nome = document.getElementById('nl-nome').value.trim(), cota = +document.getElementById('nl-cota').dataset.c || 0;
    if (!nome) { toast(ERROS.NOME_VAZIO); document.getElementById('nl-nome').focus(); return; }
    try {
      await call('apiGerAddLoja', S.senha, nome, cota, S.cotasMes || S.mes);
      usar(await call('apiGer', S.senha, S.mes)); S.cotasData = null; render();
      toast(nome + ' adicionada. Copie o link dela em Links e ajustes.');
    } catch(er){ toast(msgErro(er)[1]); }
  }
  if (f.id === 'form-email') {
    const em = document.getElementById('aj-email').value.trim();
    try { await call('apiGerAjustes', S.senha, em, ''); D.email = em; toast('E-mail salvo. O resumo das 22h30 vai para ' + em); } catch(er){ toast(msgErro(er)[1]); }
  }
  if (f.id === 'form-senha-nova') {
    const ns = document.getElementById('aj-senha').value;
    if (ns.length < 4) return toast(ERROS.SENHA_CURTA);
    try { await call('apiGerAjustes', S.senha, '', ns); S.senha = ns; store.set('cota_senha', ns, !!store.get('cota_senha')); D.senhaPadrao = false; render(); toast('Senha trocada.'); } catch(er){ toast(msgErro(er)[1]); }
  }
});
// máscara de dinheiro: os dígitos entram pela direita (1 = 0,01; 1 e 0 = 0,10),
// não importa onde o cursor esteja. Ao tocar num valor já preenchido, o primeiro número substitui o valor.
const ehDinheiro = el => el && (el.id === 'f-valor' || (el.classList && el.classList.contains('mask')));
const centsDe = el => el.id === 'f-valor' ? (S.f.valor || 0) : (+el.dataset.c || 0);
function poeCents(el, c){
  c = Math.max(0, Math.min(c, 99999999999));
  el.value = brlN(c);
  if (el.id === 'f-valor') { S.f.valor = c; const m = el.closest('.money'); if (m) m.classList.remove('err'); } else el.dataset.c = c;
  try { el.setSelectionRange(el.value.length, el.value.length); } catch(_){}
  const pv = document.getElementById('prev-parc'); if (pv) pv.textContent = '';
}
document.addEventListener('beforeinput', e => {
  const el = e.target; if (!ehDinheiro(el)) return;
  const t = e.inputType;
  if (t === 'insertText' || t === 'insertReplacementText') {
    e.preventDefault();
    const dig = String(e.data || '').replace(/\D/g, ''); if (!dig) return;
    const base = el.dataset.novo === '1' ? 0 : centsDe(el); el.dataset.novo = '';
    poeCents(el, parseInt(String(base) + dig, 10));
  } else if (t === 'deleteContentBackward' || t === 'deleteContentForward' || t === 'deleteWordBackward') {
    e.preventDefault();
    const novo = el.dataset.novo === '1'; el.dataset.novo = '';
    poeCents(el, novo ? 0 : Math.floor(centsDe(el) / 10));
  } else if (t === 'insertFromPaste' || t === 'insertFromDrop') {
    e.preventDefault();
    const txt = String(e.data || (e.dataTransfer && e.dataTransfer.getData('text')) || '');
    const n = txt.replace(/[^\d,]/g, ''); const [i, d = ''] = n.split(',');
    poeCents(el, parseInt((i || '0') + (d + '00').slice(0, 2), 10) || 0); el.dataset.novo = '';
  }
});
// reserva: teclados que não avisam antes (alguns Android) — monta o valor pelos dígitos
document.addEventListener('input', e => {
  const el = e.target; if (!ehDinheiro(el)) return;
  const d = el.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 11);
  el.dataset.novo = '';
  poeCents(el, d ? parseInt(d, 10) : 0);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'f-atend' || el.id === 'f-qtd') { const v = el.value.replace(/\D/g, '').slice(0, 5); el.value = v; S.f[el.id === 'f-atend' ? 'atend' : 'qtd'] = v; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'f-data') { if (!el.value) return; S.f = { data: el.value, valor: 0 }; S.msg = ''; if (S.modo === 'ger' && S.mes === MES_ATUAL) S.ref = el.value; render(); }
  if (el.id === 'cotas-mes') {
    S.cotasMes = el.value; S.msg = '';
    call('apiGerCotas', S.senha, el.value).then(r => { S.cotasData = r; render(); }).catch(er => toast(msgErro(er)[1]));
    return;
  }
  if (el.id === 'g-data') { if (!el.value || !el.value.startsWith(MES_ATUAL) || el.value > HOJE) return; S.ref = el.value; render(); }
});
document.addEventListener('focusin', e => {
  const el = e.target;
  // ao tocar num valor já preenchido, ele fica todo selecionado: o primeiro número digitado substitui o valor
  if (ehDinheiro(el)) { el.dataset.novo = centsDe(el) ? '1' : ''; setTimeout(() => { try { el.setSelectionRange(el.value.length, el.value.length); } catch(_){} }, 0); }
  if (el.readOnly && el.id && el.id.indexOf('lk-') === 0) el.select();
});
document.addEventListener('click', e => { if (ehDinheiro(e.target)) { try { e.target.setSelectionRange(e.target.value.length, e.target.value.length); } catch(_){} } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const n = document.getElementById('dlg-nao'); if (n) n.click(); } });

// atualização automática: gerência a cada 1 minuto, loja a cada 2 minutos (não interrompe quem está digitando)
const ativo = () => (S.modo === 'loja' && S.token) || (S.modo === 'ger' && S.gerOk);
setInterval(() => { if (document.hidden || ocupadoDigitando()) return; if (ativo()) carregar(true); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && ativo() && !ocupadoDigitando()) carregar(true); });

/* início */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(API) && !/^http:\/\/localhost/.test(API)) {
  view.innerHTML = `<div class="card lock"><h2>Falta ligar à planilha</h2><p>Abra o arquivo <b>config.js</b> no GitHub e cole o link da planilha (o que termina em <b>/exec</b>) entre as aspas.</p></div>`;
} else if (S.modo === 'loja') carregar();
else { const sv = store.get('cota_senha'); if (sv) { S.modo = 'ger'; S.senha = sv; carregar(); } else render(); }
})();
</script>
